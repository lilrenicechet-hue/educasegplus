let CAL_ANO = null;
const _rGraficosV2 = rGraficos;
rGraficos = function () {
    _rGraficosV2();
    const anos = [...new Set(REG.filter(r => r.dt && +r.dt <= Date.now() + DIA).map(r => r.dt.getFullYear()))].sort((a, b) => b - a);
    if (!anos.includes(CAL_ANO)) CAL_ANO = anos[0] || new Date().getFullYear();
    $('cont-graficos').insertAdjacentHTML('beforeend', `
    <div class="card card-pad"><div class="card-tit"><div class="ico" style="--c:var(--prim)">${ic('clock')}</div><div><h3>Calendário do ano</h3><p>Cada quadrado é um dia, colorido pelo número de ocorrências. Mostra semanas críticas, vésperas de feriado e períodos de prova.</p></div><div class="dir"><div class="seg" id="cal-anos">${anos.slice(0, 4).map(a => `<button data-a="${a}" class="${a === CAL_ANO ? 'ativo' : ''}">${a}</button>`).join('')}</div></div></div><div id="cal-grade" style="overflow-x:auto"></div></div>
    <div class="grade g2">${cardGraf('gf-dem-vit', 'Vítimas por sexo e tipo de fato', 'Pessoas citadas como vítimas nos 10 tipos mais frequentes', true)}${cardGraf('gf-dem-agr', 'Autores por sexo e tipo de fato', 'Pessoas citadas como autoras nos 10 tipos mais frequentes', true)}</div>
    <div class="grade g2">${cardGraf('gf-dem-env', 'Quem agride quem', 'Combinação entre o tipo de autor e o tipo de vítima', true)}${cardGraf('gf-dem-prop', 'Participação feminina por tipo de fato', 'Percentual de mulheres entre vítimas e entre autores', true)}</div>`);
    $('cal-anos').onclick = e => { const b = e.target.closest('button'); if (b) { CAL_ANO = +b.dataset.a; document.querySelectorAll('#cal-anos button').forEach(x => x.classList.toggle('ativo', x === b)); calendario(); } };
    calendario(); demografia();
};
function calendario() {
    const ano = CAL_ANO, cont = new Map();
    REG.forEach(r => { if (r.dt && r.dt.getFullYear() === ano) { const k = r.dt.toDateString(); cont.set(k, (cont.get(k) || 0) + 1); } });
    const mx = Math.max(1, ...cont.values());
    const ini = new Date(ano, 0, 1), dias = [];
    for (let d = new Date(ini); d.getFullYear() === ano; d.setDate(d.getDate() + 1)) dias.push(new Date(d));
    const sem0 = ini.getDay();
    const cel = 13, gap = 3, W = Math.ceil((dias.length + sem0) / 7) * (cel + gap) + 34;
    const MES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
    let svg = `<svg width="${W}" height="${7 * (cel + gap) + 26}" role="img" aria-label="Calendário de ocorrências de ${ano}" style="display:block;font-family:var(--f-corpo)">`;
    ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'].forEach((t, i) => { if (i % 2) svg += `<text x="0" y="${22 + i * (cel + gap) + 10}" font-size="9.5" fill="var(--muted)">${t}</text>`; });
    dias.forEach((d, i) => {
        const p = i + sem0, c = Math.floor(p / 7), l = p % 7, v = cont.get(d.toDateString()) || 0;
        if (d.getDate() === 1) svg += `<text x="${34 + c * (cel + gap)}" y="12" font-size="10" fill="var(--muted)">${MES[d.getMonth()]}</text>`;
        const op = v ? .18 + .82 * Math.sqrt(v / mx) : 0;
        svg += `<rect x="${34 + c * (cel + gap)}" y="${20 + l * (cel + gap)}" width="${cel}" height="${cel}" rx="3" fill="${v ? 'var(--c-crit)' : 'var(--suave2)'}" fill-opacity="${v ? op.toFixed(2) : 1}" data-d="${d.toISOString()}" style="cursor:${v ? 'pointer' : 'default'}"><title>${d.toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: '2-digit' })}: ${v} ocorrência(s)</title></rect>`;
    });
    svg += '</svg>';
    // semanas mais críticas
    const sem = new Map(); REG.forEach(r => { if (r.dt && r.dt.getFullYear() === ano) { const s = new Date(r.dt); s.setHours(0, 0, 0, 0); s.setDate(s.getDate() - s.getDay()); const k = +s; const o = sem.get(k) || { n: 0, c: 0 }; o.n++; if (r.crit === 'CRÍTICO') o.c++; sem.set(k, o); } });
    const top = [...sem.entries()].sort((a, b) => b[1].n - a[1].n).slice(0, 5);
    $('cal-grade').innerHTML = svg + `<div class="peq" style="margin-top:10px;display:flex;gap:8px 18px;flex-wrap:wrap;color:var(--texto2)"><b>Semanas com mais registros:</b>${top.map(([k, o]) => `<span>${new Date(k).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' })}: <b>${o.n}</b> (${o.c} críticas)</span>`).join('')}</div>`;
    $('cal-grade').querySelectorAll('rect[data-d]').forEach(rc => rc.onclick = () => { const d = new Date(rc.dataset.d).toDateString(); const rs = REG.filter(r => r.dt && r.dt.toDateString() === d); if (rs.length) listaModal('Ocorrências de ' + new Date(rc.dataset.d).toLocaleDateString('pt-BR'), rs); });
}
const normSexo = s => /^F/i.test(chave(s)) ? 'Feminino' : /^M/i.test(chave(s)) ? 'Masculino' : 'Não informado';
const normEnv = s => { const k = chave(s); return /ALUN|ESTUD/.test(k) ? 'Estudante' : /PROF|SERVID|DIRET|COORD|FUNCION|PROFISSIONAL/.test(k) ? 'Profissional' : /EXTERN|COMUNID|RESPONS|FAMIL|PAI|MAE/.test(k) ? 'Externo/família' : 'Não informado'; };
function demografia() {
    const tipos = tiposOrd().slice(0, 10).map(t => t[0]);
    const contar = (lista, sexos) => { const m = new Map(tipos.map(t => [t, { Feminino: 0, Masculino: 0, 'Não informado': 0 }])); REG.forEach(r => { if (!m.has(r.tipo)) return; r[lista].forEach((n, i) => { m.get(r.tipo)[normSexo(r[sexos][i])]++; }); }); return m; };
    const mv = contar('vit', 'sVit'), ma = contar('agr', 'sAgr');
    const cores = { Feminino: css('--s5'), Masculino: css('--s1'), 'Não informado': css('--muted2') };
    const barra = (id, m) => grafico(id, { type: 'bar', data: { labels: tipos.map(tipoCurto), datasets: ['Feminino', 'Masculino', 'Não informado'].map(sx => ({ label: sx, data: tipos.map(t => m.get(t)[sx]), backgroundColor: cores[sx], borderRadius: 3, borderSkipped: false, borderColor: css('--card'), borderWidth: { left: 0, right: 2, top: 0, bottom: 0 } })) }, options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, usePointStyle: true } } }, scales: { x: { stacked: true, ticks: { precision: 0 } }, y: { stacked: true, grid: { display: false } } } } });
    barra('gf-dem-vit', mv); barra('gf-dem-agr', ma);
    // autor × vítima
    const ENV = ['Estudante', 'Profissional', 'Externo/família', 'Não informado'], par = new Map();
    REG.forEach(r => { const as = new Set(r.tAgr.map(normEnv)), vs = new Set(r.tVit.map(normEnv)); as.forEach(a => vs.forEach(v => { const k = a + '|' + v; par.set(k, (par.get(k) || 0) + 1); })); });
    grafico('gf-dem-env', { type: 'bar', data: { labels: ENV.map(a => 'Autor: ' + a), datasets: ENV.slice(0, 3).map((v, i) => ({ label: 'Vítima: ' + v, data: ENV.map(a => par.get(a + '|' + v) || 0), backgroundColor: css(SERIE3[i]), borderRadius: 3 })) }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, usePointStyle: true } } }, scales: { x: { grid: { display: false } }, y: { beginAtZero: true, ticks: { precision: 0 } } } } });
    const pct = (m, t) => { const o = m.get(t), s = o.Feminino + o.Masculino; return s ? Math.round(100 * o.Feminino / s) : 0; };
    grafico('gf-dem-prop', { type: 'bar', data: { labels: tipos.map(tipoCurto), datasets: [{ label: 'Entre vítimas (%)', data: tipos.map(t => pct(mv, t)), backgroundColor: css('--s5'), borderRadius: 3 }, { label: 'Entre autores (%)', data: tipos.map(t => pct(ma, t)), backgroundColor: css('--s4'), borderRadius: 3 }] }, options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, usePointStyle: true } } }, scales: { x: { min: 0, max: 100, ticks: { callback: v => v + '%' } }, y: { grid: { display: false } } } } });
}

/* 1. Preserva a posição da rolagem quando a mesma página é redesenhada (filtro, sincronização, tema) */
const POS_ROLAGEM = {};

renderAba = function () {
    const sc = $('aba-' + ABA), mesma = sc && POS_ROLAGEM._ultima === ABA, top = mesma ? sc.scrollTop : (POS_ROLAGEM[ABA] || 0);
    _renderAbaV4();
    POS_ROLAGEM._ultima = ABA;
    if (!sc) return;
    const repor = () => { if (ABA === POS_ROLAGEM._ultima && Math.abs(sc.scrollTop - top) > 2) sc.scrollTop = Math.min(top, sc.scrollHeight - sc.clientHeight); };
    repor(); requestAnimationFrame(repor); setTimeout(repor, 120); setTimeout(repor, 400);
};
document.addEventListener('scroll', e => { const t = e.target; if (t && t.classList && t.classList.contains('aba')) POS_ROLAGEM[t.id.slice(4)] = t.scrollTop; }, true);
/* Ao trocar de página pelo menu, volta ao topo dela */
document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('.lat-btn'); if (b) { POS_ROLAGEM[b.dataset.aba] = 0; const s = $('aba-' + b.dataset.aba); if (s) s.scrollTop = 0; } }, true);

/* 2. Mapas não "sequestram" a rolagem: zoom pela roda só depois de clicar no mapa;
      no celular, arrastar o mapa só depois de tocar nele (o dedo rola a página). */
if (typeof L !== 'undefined') {
    L.Map.mergeOptions({ scrollWheelZoom: false });
    const toque = matchMedia('(pointer: coarse)').matches;
    L.Map.addInitHook(function () {
        const m = this, el = m.getContainer();
        if (toque) { m.dragging.disable(); m.touchZoom.disable(); if (m.tap) m.tap.disable(); }
        const dica = L.DomUtil.create('div', 'mapa-dica', el);
        dica.textContent = toque ? 'Toque no mapa para mover e ampliar' : 'Clique no mapa para usar a roda do mouse';
        dica.style.opacity = '0';
        let t;
        const mostrar = () => { if (m._ativo) return; dica.style.opacity = '1'; clearTimeout(t); t = setTimeout(() => { dica.style.opacity = '0'; }, 1400); };
        const ativar = () => { m._ativo = true; dica.style.opacity = '0'; m.scrollWheelZoom.enable(); if (toque) { m.dragging.enable(); m.touchZoom.enable(); } };
        const desativar = () => { m._ativo = false; m.scrollWheelZoom.disable(); if (toque) { m.dragging.disable(); m.touchZoom.disable(); } };
        m.on('click focus', ativar);
        el.addEventListener('wheel', mostrar, { passive: true });
        if (toque) el.addEventListener('touchmove', e => { if (!m._ativo && e.touches.length === 1) mostrar(); }, { passive: true });
        el.addEventListener('mouseleave', desativar);
        document.addEventListener('touchstart', e => { if (m._ativo && !el.contains(e.target)) desativar(); }, { passive: true });
    });
}

contornoMT = function () {
    const g = GEO_MT.uf, polys = g.type === 'Polygon' ? [g.coordinates] : g.coordinates;
    let x0 = 180, x1 = -180, y0 = 90, y1 = -90;
    polys.forEach(p => p[0].forEach(([x, y]) => { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }));
    const W = 400, H = W * (y1 - y0) / (x1 - x0), px = x => (x - x0) / (x1 - x0) * W, py = y => (y1 - y) / (y1 - y0) * H;
    const d = polys.map(p => p.map(r => 'M' + r.map(([x, y]) => px(x).toFixed(1) + ',' + py(y).toFixed(1)).join('L') + 'Z').join('')).join('');
    const munD = MUNS.map(m => { const gg = m.g, ps = gg.type === 'Polygon' ? [gg.coordinates] : gg.coordinates; return ps.map(p => 'M' + p[0].map(([x, y]) => px(x).toFixed(1) + ',' + py(y).toFixed(1)).join('L') + 'Z').join(''); }).join('');

const ATUALIZACAO = { reg: null, aviso: false, notas: '' };
function mostrarAvisoAtualizacao(notas) {
    if (ATUALIZACAO.aviso || EM_ARTEFATO) return;

}
function atualizarAgora() {
    const b = $('av-agora'); if (b) { b.disabled = true; b.innerHTML = ic('clock') + 'Atualizando…'; }
    const reg = ATUALIZACAO.reg;
    const recarregar = () => { try { sessionStorage.setItem('esp_atualizado', '1'); } catch (e) { } location.reload(); };
    if (reg && reg.waiting) {
        navigator.serviceWorker.addEventListener('controllerchange', recarregar, { once: true });
        reg.waiting.postMessage('ATUALIZAR');
        setTimeout(recarregar, 2500);
    } else recarregar();
}
async function verificarVersao() {
    if (EM_ARTEFATO || !/^https?:$/.test(location.protocol)) return;
    if (ATUALIZACAO.adiadoAte && Date.now() < ATUALIZACAO.adiadoAte) return;
    try { if (ATUALIZACAO.reg) ATUALIZACAO.reg.update(); } catch (e) { }
    try {
        const r = await fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' });
        if (!r.ok) return;
        const t = await r.text(), m = t.match(/APP_VERSAO = '([^']+)'/), n = t.match(/APP_NOTAS = '([^']*)'/);
        if (m && m[1] !== APP_VERSAO) mostrarAvisoAtualizacao(n ? n[1] : '');
    } catch (e) { }
}
registrarSW = function () {
    if (EM_ARTEFATO || !('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
    navigator.serviceWorker.register('sw.js').then(reg => {
        ATUALIZACAO.reg = reg;
        const reforcarManifesto = () => { const l = document.querySelector('link[rel=manifest]'); if (l && !l.dataset.ok) { l.dataset.ok = '1'; l.href = 'manifest.webmanifest?v=' + Date.now(); } };
        if (navigator.serviceWorker.controller) reforcarManifesto();
        navigator.serviceWorker.addEventListener('controllerchange', reforcarManifesto);
        const vigiar = w => w && w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) mostrarAvisoAtualizacao(); });
        if (reg.waiting && navigator.serviceWorker.controller) mostrarAvisoAtualizacao();
        reg.addEventListener('updatefound', () => vigiar(reg.installing));
    }).catch(() => { });
    setTimeout(verificarVersao, 60000);
    setInterval(verificarVersao, 15 * 60000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') verificarVersao(); });
};

        pe: `<button class="btn btn-s" data-fechar>Fechar</button><button class="btn btn-s" onclick="baixar('release-escolas-mt-${new Date().toISOString().slice(0, 10)}.txt', textoRelease(window.NWS_LISTA||[]))">${ic('download')}Baixar .txt</button><button class="btn btn-p" onclick="copiar(textoRelease(window.NWS_LISTA||[]))">${ic('copy')}Copiar</button>` });
}

function rRelease() {
    const pode = USUARIO && ['ADMIN', 'INTELIGENCIA'].includes(USUARIO.perfil);
    $('acoes-release').innerHTML = `<div class="seg" style="background:rgba(255,255,255,.08)" id="rl-dias">${[7, 30, 90, 180].map(d => `<button data-d="${d}" class="${NWS.dias === d ? 'ativo' : ''}" style="${NWS.dias === d ? '' : 'color:#cbd5e1'}">${d} dias</button>`).join('')}</div>
        ${rlServidor() && pode ? `<button class="btn btn-v btn-sm" onclick="carregarRelease(true)" ${NWS.carregando ? 'disabled' : ''}>${ic('repeat')}Buscar agora</button>` : ''}
        ${NWS.d ? `<button class="btn btn-v btn-sm" onclick="abrirTextoRelease()">${ic('doc')}Gerar release</button>` : ''}`;
    $('rl-dias').onclick = e => { const b = e.target.closest('button'); if (b) { NWS.dias = +b.dataset.d; NWS.lim = 30; rRelease(); } };
    const C = $('cont-release');
    if (!rlServidor()) {
        C.innerHTML = `<div class="card card-pad rl-vazio"><div class="rl-vazio-ic">${ic('jornal')}</div><h3>O Release precisa do servidor</h3><p>As notícias são buscadas pelo servidor do sistema (Google Apps Script), que consulta o Google Notícias a cada 6 horas e guarda as matérias na planilha. No modo local não há como buscar na internet.</p><ol><li>Entre com usuário e senha (servidor Google Sheets).</li><li>No Apps Script, cole o <b>Codigo.gs 2.3</b>, rode "1. Configurar planilha" e publique uma nova versão.</li><li>Como Administrador, reinstale as rotinas em Usuários › Rotinas e backup.</li></ol></div>`;
        return;
    }
    if (!NWS.d || NWS.janela < rlPrecisa()) { if (!NWS.carregando && !NWS.erro) { carregarRelease(); return; } }
    if (NWS.erro && !NWS.d) { C.innerHTML = `<div class="card card-pad rl-vazio"><div class="rl-vazio-ic" style="--c:var(--c-crit)">${ic('alerta')}</div><h3>Não foi possível carregar as notícias</h3><p>${esc(NWS.erro)}</p><p class="mut peq">Se o servidor ainda está na versão 2.2, atualize o Codigo.gs para a 2.3.</p><button class="btn btn-p" onclick="NWS.erro='';carregarRelease(true)">${ic('repeat')}Tentar de novo</button></div>`; return; }
    if (!NWS.d) { C.innerHTML = `<div class="card card-pad rl-vazio"><div class="rl-vazio-ic rl-gira">${ic('repeat')}</div><h3>Buscando notícias…</h3><p>Na primeira vez o servidor consulta o Google Notícias e pode levar até um minuto.</p></div>`; return; }

    const agora = Date.now(), ini = new Date(agora - NWS.dias * DIA), iniAnt = new Date(agora - 2 * NWS.dias * DIA);
    const todas = NWS.d.noticias.filter(n => n.data >= ini), ant = NWS.d.noticias.filter(n => n.data >= iniAnt && n.data < ini);
    const q = chave(NWS.q);
    const lista = window.NWS_LISTA = todas.filter(n => (!NWS.cat || n.cats.includes(NWS.cat)) && (!NWS.mun || n.munK === NWS.mun) && (!NWS.env || n.env.includes(NWS.env)) && (!q || chave(n.titulo + ' ' + n.fonte + ' ' + n.mun + ' ' + n.escola).includes(q)));
    const varia = (a, b) => b ? `<span class="rl-var" style="color:${a > b ? 'var(--c-crit)' : a < b ? 'var(--verde)' : 'var(--muted)'}">${a > b ? '▲' : a < b ? '▼' : '■'} ${Math.abs(Math.round(100 * (a - b) / b))}%</span>` : '';
    const nViol = todas.filter(rlViol).length, nViolA = ant.filter(rlViol).length;
    const nProf = todas.filter(n => n.env.includes('Professores')).length, nProfA = ant.filter(n => n.env.includes('Professores')).length;
    const munsC = new Set(todas.map(n => n.munK).filter(Boolean)), fontes = new Set(todas.map(n => n.fonte));
    const kpi = (c, i, t, v, s, vr) => `<div class="kpi" style="--c:${c}"><div class="r">${ic(i)}${t}</div><div class="v">${fmtN(v)} ${vr || ''}</div><div class="s">${s}</div></div>`;
    const kpis = `<div class="kpis">${kpi('var(--prim)', 'jornal', 'Notícias', todas.length, `nos últimos ${NWS.dias} dias`, varia(todas.length, ant.length))}${kpi('var(--c-crit)', 'alerta', 'Casos de violência', nViol, 'agressão, arma, ameaça, abuso ou morte', varia(nViol, nViolA))}${kpi('var(--roxo)', 'user', 'Com professores', nProf, 'professores como vítimas ou envolvidos', varia(nProf, nProfA))}${kpi('var(--c-baixo)', 'pin', 'Municípios citados', munsC.size, `${fontes.size} veículo(s) de imprensa`)}</div>`;

    const cont = (arr, f) => { const m = new Map(); arr.forEach(x => f(x).forEach(k => k && m.set(k, (m.get(k) || 0) + 1))); return [...m.entries()].sort((a, b) => b[1] - a[1]); };
    const porCat = cont(todas, n => n.cats), porMun = cont(todas, n => [n.munK]).slice(0, 10), porFonte = cont(todas, n => [n.fonte]).slice(0, 8);
    // cruzamento: notícias de violência em municípios sem registro no Livro na mesma semana
    const semLivro = todas.filter(n => rlViol(n) && n.munK && !rlLivro(n).length);
    const ultima = NWS.d.ultimaColeta ? new Date(NWS.d.ultimaColeta) : null;

    const chipsCat = `<div class="rl-chips">${[['', 'Todos os assuntos', todas.length]].concat(porCat.map(([k, v]) => [k, k, v])).map(([k, t, v]) => `<button class="chip${NWS.cat === k ? ' ativo' : ''}" style="--c:${NWS_COR[k] || 'var(--prim)'}" onclick="NWS.cat='${esc(k)}';NWS.lim=30;rRelease()"><span class="pt"></span>${esc(t)} <span class="q">${v}</span></button>`).join('')}</div>`;
    const filtros = `<div class="card card-pad rl-filtros">
        <div class="busca">${ic('search')}<input class="campo" id="rl-q" placeholder="Buscar no título, veículo, município ou escola" value="${esc(NWS.q)}"></div>
        <select class="campo" id="rl-mun"><option value="">Todos os municípios</option>${cont(todas, n => [n.munK]).map(([k, v]) => `<option value="${esc(k)}" ${NWS.mun === k ? 'selected' : ''}>${esc(nomeMun(k))} (${v})</option>`).join('')}</select>
        <select class="campo" id="rl-env"><option value="">Todos os envolvidos</option>${['Alunos', 'Professores', 'Gestão e servidores', 'Famílias'].map(k => `<option ${NWS.env === k ? 'selected' : ''}>${k}</option>`).join('')}</select>
        ${NWS.cat || NWS.mun || NWS.env || NWS.q ? `<button class="btn btn-s btn-sm" onclick="NWS.cat='';NWS.mun='';NWS.env='';NWS.q='';rRelease()">${ic('x')}Limpar</button>` : ''}
        ${chipsCat}</div>`;

    const cartao = n => {
        const g = rlGrav(n), cor = g === 'critico' ? 'var(--c-crit)' : g === 'alto' ? 'var(--c-alto)' : 'var(--prim)', liv = rlLivro(n), e = rlEscola(n);
        const ini2 = (n.fonte || '?').replace(/[^A-Za-zÀ-ú0-9 ]/g, '').split(' ').filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
        return `<article class="rl-not" style="--c:${cor}">
            <div class="rl-not-top"><span class="rl-fonte-ic">${esc(ini2 || '?')}</span><span class="rl-fonte"><b>${esc(n.fonte || 'Fonte não informada')}</b><small>${n.data.toLocaleDateString('pt-BR')} · ${n.data.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })} · ${haDias(n.data)}</small></span>${g !== 'medio' ? `<span class="selo" style="--c:${cor}">${g === 'critico' ? 'Grave' : 'Atenção'}</span>` : ''}</div>
            <a class="rl-tit" href="${esc(n.link)}" target="_blank" rel="noopener noreferrer">${esc(n.titulo)} ${ic('link')}</a>
            <div class="rl-tags">${n.cats.map(c => `<button class="rl-tag" style="--c:${NWS_COR[c] || 'var(--muted)'}" onclick="NWS.cat='${esc(c)}';rRelease()">${esc(c)}</button>`).join('')}${n.env.map(v => `<span class="rl-tag env">${esc(v)}</span>`).join('')}</div>
            <div class="rl-not-rod">
                ${n.mun ? `<button class="rl-lnk" onclick="NWS.mun='${esc(n.munK)}';rRelease()">${ic('pin')}${esc(n.mun)}</button>` : '<span class="mut">município não identificado</span>'}
                ${e ? (e.noLivro ? `<button class="rl-lnk" onclick="abrirEscola('${esc(e.k)}')">${ic('escola')}${esc(e.nome)}</button>` : `<span class="rl-lnk">${ic('escola')}${esc(e.nome)}</span>`) : n.escola ? `<span class="rl-lnk">${ic('escola')}${esc(n.escola)}</span>` : ''}
                ${n.munK ? (liv.length ? `<button class="rl-livro" onclick="listaModal('Livro: ${esc(n.mun)} entre ${new Date(+n.data - 7 * DIA).toLocaleDateString('pt-BR')} e ${new Date(+n.data + 7 * DIA).toLocaleDateString('pt-BR')}', NWS_LISTA.find(x=>x.id==='${esc(n.id)}')._livro)">${ic('book')}${liv.length} no Livro ±7 dias</button>` : (rlViol(n) ? `<span class="rl-livro falta">${ic('alerta')}Sem registro no Livro ±7 dias</span>` : '')) : ''}
            </div></article>`;
    };

    C.innerHTML = `
    <div class="card card-pad rl-status"><span class="rl-pulso${NWS.carregando ? ' on' : ''}"></span><span>${NWS.carregando ? 'Atualizando notícias…' : `Última coleta ${ultima ? 'em ' + fmtDH(ultima) + ' (' + haDias(ultima).replace('há ', 'há ') + ')' : 'ainda não feita'}`} · ${NWS.d.consultas || ''} buscas no Google Notícias · coleta automática a cada 6 h</span><span class="mut" style="margin-left:auto">Classificação automática por palavras-chave: confirme na matéria original.</span></div>
    ${kpis}
    <div class="grade" style="grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);align-items:stretch" id="rl-g1">
        <div class="card card-pad"><div class="card-tit"><div class="ico">${ic('bar')}</div><div><h3>Notícias ao longo do tempo</h3><p>Em vermelho, as matérias sobre casos de violência</p></div></div>${todas.length ? rlBarras(todas, ini, new Date(agora)) : '<div class="vazio peq">Nenhuma notícia no período.</div>'}</div>
        <div class="card card-pad"><div class="card-tit"><div class="ico" style="--c:var(--c-alto)">${ic('grid')}</div><div><h3>Assuntos</h3><p>Uma notícia pode ter mais de um. Clique para filtrar.</p></div></div>${hbar(porCat.map(([k, v]) => ({ t: k, v, c: NWS_COR[k] || 'var(--prim)', on: `NWS.cat='${esc(k)}';rRelease()` })))}</div>
    </div>
    <div class="grade g3" style="align-items:stretch" id="rl-g2">
        <div class="card card-pad"><div class="card-tit"><div class="ico" style="--c:var(--c-baixo)">${ic('map')}</div><div><h3>Municípios mais citados</h3><p>Clique para filtrar</p></div></div>${hbar(porMun.map(([k, v]) => ({ t: nomeMun(k), v, c: 'var(--c-baixo)', on: `NWS.mun='${esc(k)}';rRelease()` })))}</div>
        <div class="card card-pad"><div class="card-tit"><div class="ico" style="--c:var(--roxo)">${ic('jornal')}</div><div><h3>Veículos de imprensa</h3><p>Quem mais publicou no período</p></div></div>${hbar(porFonte.map(([k, v]) => ({ t: k, v, c: 'var(--roxo)' })))}</div>
        <div class="card card-pad"><div class="card-tit"><div class="ico" style="--c:var(--c-crit)">${ic('book')}</div><div><h3>Mídia × Livro de Ocorrências</h3><p>Casos de violência noticiados sem registro no Livro no mesmo município (±7 dias)</p></div></div>
            ${semLivro.length ? `<div class="rl-falta-n"><b>${semLivro.length}</b><span>de ${nViol} notícias de violência com município identificado não têm registro correspondente. Pode indicar subnotificação.</span></div><div class="lista">${semLivro.slice(0, 4).map(n => `<a class="item" href="${esc(n.link)}" target="_blank" rel="noopener noreferrer"><span class="ic" style="--c:var(--c-crit)">${ic('alerta')}</span><span class="tx"><b>${esc(n.mun)}</b><span>${esc(n.titulo)}</span></span></a>`).join('')}</div>` : `<div class="vazio peq">${ic('check')}Toda notícia de violência com município identificado tem registro no Livro na mesma semana.</div>`}</div>
    </div>
    ${filtros}
    <div class="card"><div class="card-pad" style="padding-bottom:6px"><div class="card-tit" style="margin:0"><div class="ico">${ic('jornal')}</div><div><h3>Notícias</h3><p>${lista.length} de ${todas.length} no período, da mais recente para a mais antiga. O título abre a matéria no site do veículo.</p></div></div></div>
        <div class="rl-lista">${lista.slice(0, NWS.lim).map(cartao).join('') || `<div class="vazio">${ic('search')}Nenhuma notícia com esses filtros.</div>`}</div>
        ${lista.length > NWS.lim ? `<div style="padding:0 18px 18px;text-align:center"><button class="btn btn-s" onclick="NWS.lim+=30;rRelease()">Mostrar mais ${Math.min(30, lista.length - NWS.lim)} de ${lista.length - NWS.lim}</button></div>` : '<div style="height:8px"></div>'}
    </div>`;
    let t; $('rl-q').oninput = () => { clearTimeout(t); t = setTimeout(() => { NWS.q = $('rl-q').value; NWS.lim = 30; rRelease(); const i = $('rl-q'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 300); };
    $('rl-mun').onchange = () => { NWS.mun = $('rl-mun').value; NWS.lim = 30; rRelease(); };
    $('rl-env').onchange = () => { NWS.env = $('rl-env').value; NWS.lim = 30; rRelease(); };
    if (matchMedia('(max-width: 900px)').matches) ['rl-g1'].forEach(id => { const g = $(id); if (g) g.style.gridTemplateColumns = 'minmax(0,1fr)'; });
}

};

    if (FONTE.demo) secoes.unshift({ t: 'Observação', html: '<p style="background:#fef3c7;border:1px solid #f59e0b;padding:8px 10px;border-radius:6px"><b>Atenção:</b> relatório gerado com dados de demonstração fictícios.</p>' });
    const o = { tipo: 'Relatório de Inteligência', titulo: RL.titulo, subtitulo: 'Segurança escolar na rede estadual de Mato Grosso · ' + descRecorte(), cls: RL.cls, codigo: RL.codigo, destinatario: RL.dest, secoes,
        ficha: [['Nº do documento', RL.codigo], ['Data de referência dos dados', fmtD(A.hoje)], ['Recorte analisado', descRecorte()], ['Registros analisados', fmtN(REG.length)], ['Fonte', FONTE.nome + (FONTE.selo ? ' · ' + FONTE.selo : '')]] };
    RL.html = montarDocumento(o);
    f.innerHTML = RL.html;
};
rRelatorio = function () {

    if (!$('rl-titulo') || !$('rl-dest')) {
        $('cont-relatorio').innerHTML = `<div class="card card-pad"><div class="form-grade">
            <div><label class="rot" for="rl-titulo">Título</label><input class="campo" id="rl-titulo" value="${esc(RL.titulo)}"></div>

            <p class="dica">O documento usa o recorte da barra superior e sai com capa, selo de autenticidade, cabeçalho e rodapé em todas as páginas, marcas de documento restrito e aviso de sigilo com as penalidades. Nomes de crianças e adolescentes não entram no relatório.</p></div></div></div>

        $('rl-titulo').oninput = () => { RL.titulo = $('rl-titulo').value; folhaRelatorio(); };

        $('rl-cls').onchange = () => { RL.cls = $('rl-cls').value; folhaRelatorio(); };
        $('rl-sec').onchange = e => { const i = e.target.closest('input'); if (i) { RL.sec[i.dataset.s] = i.checked; folhaRelatorio(); } };

/* =====================================================================
   RELATÓRIO DO RELEASE
   ===================================================================== */
function documentoRelease() {
    const agora = Date.now(), ini = new Date(agora - NWS.dias * DIA), iniAnt = new Date(agora - 2 * NWS.dias * DIA);
    const todas = NWS.d.noticias.filter(n => n.data >= ini), ant = NWS.d.noticias.filter(n => n.data >= iniAnt && n.data < ini);
    const lista = (window.NWS_LISTA || todas).slice();
    const viol = lista.filter(rlViol), prof = lista.filter(n => n.env.includes('Professores'));
    const cont = (arr, f) => { const m = new Map(); arr.forEach(x => f(x).forEach(k => k && m.set(k, (m.get(k) || 0) + 1))); return [...m.entries()].sort((a, b) => b[1] - a[1]); };
    const filtros = [NWS.cat, NWS.mun && nomeMun(NWS.mun), NWS.env, NWS.q && '"' + NWS.q + '"'].filter(Boolean).join(', ');
    const pct = (a, b) => b ? ((a > b ? '+' : '') + Math.round(100 * (a - b) / b) + '% em relação aos ' + NWS.dias + ' dias anteriores') : 'sem base de comparação';
    const corC = c => ({ 'Arma': '#be123c', 'Ameaça de ataque': '#be123c', 'Violência sexual': '#be123c', 'Morte': '#be123c', 'Violência física': '#ea580c', 'Drogas': '#ea580c', 'Saúde mental': '#7c3aed', 'Bullying e discriminação': '#7c3aed', 'Crime e polícia': '#ca8a04', 'Estrutura e gestão': '#0f9488' }[c] || '#64748b');
    const barras = (arr, cor) => { const mx = Math.max(1, ...arr.map(x => x[1])); return `<table class="t"><thead><tr><th>Item</th><th style="width:48%"></th><th style="text-align:right">Qtd.</th></tr></thead><tbody>${arr.map(([k, v]) => `<tr><td>${esc(k)}</td><td><span class="dx-barra" style="width:${Math.max(2, 100 * v / mx)}%;background:${cor ? cor(k) : '#173b8f'}"></span></td><td style="text-align:right">${v}</td></tr>`).join('')}</tbody></table>`; };
    // evolução (SVG com cores fixas para funcionar fora do sistema)
    const semana = NWS.dias > 45, passo = semana ? 7 * DIA : DIA, cols = []; for (let t = +ini; t < agora; t += passo) cols.push({ t, n: 0, v: 0 });
    lista.forEach(n => { const i = Math.floor((n.data - ini) / passo); if (cols[i]) { cols[i].n++; if (rlViol(n)) cols[i].v++; } });
    const mx = Math.max(1, ...cols.map(c => c.n)), W = 660, H = 120, bw = W / cols.length;
    const svg = `<svg viewBox="0 0 ${W} ${H}">${cols.map((c, i) => { const h = c.n / mx * (H - 20), hv = c.v / mx * (H - 20); return `<rect x="${i * bw + bw * .15}" y="${H - 14 - h}" width="${bw * .7}" height="${h}" fill="#93a8d6"/><rect x="${i * bw + bw * .15}" y="${H - 14 - hv}" width="${bw * .7}" height="${hv}" fill="#be123c"/>`; }).join('')}<line x1="0" x2="${W}" y1="${H - 14}" y2="${H - 14}" stroke="#cbd5e1"/><text x="0" y="${H - 2}" font-size="8" fill="#64748b" font-family="Arial">${ini.toLocaleDateString('pt-BR')}</text><text x="${W}" y="${H - 2}" font-size="8" text-anchor="end" fill="#64748b" font-family="Arial">${new Date().toLocaleDateString('pt-BR')}</text></svg>`;
    const semLivro = viol.filter(n => n.munK && !rlLivro(n).length);
    const secoes = [
        { t: 'Síntese', html: `<div class="dx-kpis"><div><small>Notícias</small><b>${fmtN(lista.length)}</b></div><div style="--c:#be123c"><small>Casos de violência</small><b>${fmtN(viol.length)}</b></div><div style="--c:#7c3aed"><small>Com professores</small><b>${fmtN(prof.length)}</b></div><div style="--c:#0f9488"><small>Municípios citados</small><b>${fmtN(new Set(lista.map(n => n.munK).filter(Boolean)).size)}</b></div></div>
            <ul style="margin:6px 0 0;padding-left:16px"><li>${fmtN(todas.length)} notícias sobre escolas de Mato Grosso nos últimos ${NWS.dias} dias (${pct(todas.length, ant.length)}).</li>
            <li>${fmtN(todas.filter(rlViol).length)} tratam de casos de violência (${pct(todas.filter(rlViol).length, ant.filter(rlViol).length)}).</li>
            <li>${fmtN(new Set(todas.map(n => n.fonte)).size)} veículos de imprensa publicaram sobre o tema no período.</li>
            ${semLivro.length ? `<li><b>${semLivro.length}</b> notícia(s) de violência não têm registro correspondente no Livro de Ocorrências no mesmo município (±7 dias).</li>` : ''}
            ${filtros ? `<li>Filtros aplicados neste documento: ${esc(filtros)}.</li>` : ''}</ul>
            <div class="dx-graf"><div class="tt">Notícias por ${semana ? 'semana' : 'dia'} (vermelho = violência)</div>${svg}</div>` },
        { t: 'Assuntos das notícias', html: `<p>Uma notícia pode tratar de mais de um assunto.</p>${barras(cont(lista, n => n.cats), corC)}` },
        { t: 'Municípios e veículos', html: `<table style="width:100%;border-collapse:collapse"><tr><td style="width:50%;vertical-align:top;padding-right:8px"><b>Municípios mais citados</b>${barras(cont(lista, n => [n.mun]).slice(0, 12), () => '#0f9488')}</td><td style="vertical-align:top;padding-left:8px"><b>Veículos de imprensa</b>${barras(cont(lista, n => [n.fonte]).slice(0, 12), () => '#7c3aed')}</td></tr></table>` },
        { t: 'Mídia × Livro de Ocorrências', html: semLivro.length ? `<p>Casos de violência noticiados sem nenhum registro no Livro no mesmo município entre 7 dias antes e 7 dias depois da notícia. Podem indicar subnotificação e devem ser conferidos com a DRE.</p><table class="t"><thead><tr><th>Data</th><th>Município</th><th>Notícia</th><th>Veículo</th></tr></thead><tbody>${semLivro.map(n => `<tr><td>${n.data.toLocaleDateString('pt-BR')}</td><td>${esc(n.mun)}</td><td><a href="${esc(n.link)}">${esc(n.titulo)}</a></td><td>${esc(n.fonte)}</td></tr>`).join('')}</tbody></table>` : '<p>Toda notícia de violência com município identificado tem registro no Livro na mesma semana.</p>' },
        { t: 'Notícias do período', html: `<p>${lista.length} notícia(s), da mais recente para a mais antiga${lista.length > 300 ? ' (mostrando as 300 primeiras)' : ''}. O título leva à matéria original.</p><table class="t"><thead><tr><th style="width:62px">Data</th><th>Notícia</th><th>Município</th><th>Assuntos</th></tr></thead><tbody>${lista.slice(0, 300).map(n => `<tr><td>${n.data.toLocaleDateString('pt-BR')}</td><td><a href="${esc(n.link)}">${esc(n.titulo)}</a><br><span style="color:#64748b">${esc(n.fonte)}</span></td><td>${esc(n.mun || '—')}</td><td>${n.cats.map(c => `<span class="tag" style="background:${corC(c)};margin:0 2px 2px 0">${esc(c)}</span>`).join('')}</td></tr>`).join('')}</tbody></table>` },
        { t: 'Nota metodológica', html: `<p>As notícias são coletadas automaticamente no Google Notícias pelo servidor do sistema, a cada 6 horas, com ${NWS.d.consultas || 'várias'} buscas sobre escolas de Mato Grosso. A última coleta foi em ${NWS.d.ultimaColeta ? fmtDH(new Date(NWS.d.ultimaColeta)) : '—'}.</p><p>Assunto, envolvidos e município são identificados por palavras-chave no título e podem conter erros. Cada caso deve ser confirmado na matéria original e, quando for o caso, com a escola e a DRE.</p>` }
    ];
    const codigo = codigoVerificacao('release|' + NWS.dias + '|' + lista.map(n => n.id).join(','));
    const titulo = 'Release · Escolas de Mato Grosso na mídia';
    const html = montarDocumento({ tipo: 'Relatório de Release', titulo, subtitulo: `Monitoramento de imprensa · últimos ${NWS.dias} dias (${ini.toLocaleDateString('pt-BR')} a ${new Date().toLocaleDateString('pt-BR')})`, cls: 'DOCUMENTO RESTRITO', codigo, destinatario: NWS.dest || '', secoes,
        ficha: [['Nº do documento', codigo], ['Período', `${ini.toLocaleDateString('pt-BR')} a ${new Date().toLocaleDateString('pt-BR')} (${NWS.dias} dias)`], ['Filtros', filtros || 'nenhum'], ['Notícias no documento', fmtN(lista.length)], ['Fonte', 'Google Notícias (coleta automática) e Livro de Ocorrências']] });
    return { html, codigo, titulo, n: lista.length };
}
function baixarRelatorioRelease(fmt) {
    if (!NWS.d) return;
    const D = documentoRelease();
    if (conectado()) api('registrarRelatorio', { codigo: D.codigo, titulo: D.titulo, classificacao: 'DOCUMENTO RESTRITO', recorte: 'Release · ' + NWS.dias + ' dias', registros: D.n }).catch(e => toast('Documento gerado, mas o código não foi registrado no servidor: ' + e.message, 'alerta'));
    exportarDocumento(D.html, D.titulo, 'EDUCASEG-PLUS_release_' + D.codigo + '_' + hojeArq(), fmt);
}
const _rReleaseV11 = rRelease;
rRelease = function () {
    _rReleaseV11();
    if (NWS.d) { const a = $('acoes-release'); if (a && !a.querySelector('[data-rel-doc]')) a.insertAdjacentHTML('beforeend', `<button class="btn btn-p btn-sm" data-rel-doc onclick="escolherFormato('Baixar relatório do Release', 'baixarRelatorioRelease')">${ic('download')}Baixar relatório</button>`); }
};

/* =====================================================================
   RELEASE — monitoramento institucional (Secretária de Educação e outros nomes da aba Config)
   ===================================================================== */
const _rReleaseMon = rRelease;
rRelease = function () {
    const mons = NWS.d && NWS.d.monitorados ? [...new Set(NWS.d.monitorados.map(m => m.rotulo))] : [];
    mons.forEach(r => { NWS_COR[r] = NWS_COR[r] || 'var(--marca2)'; });
    _rReleaseMon();
    if (!NWS.d || !mons.length) return;
    const k = document.querySelector('#cont-release .kpis'); if (!k) return;
    const agora = Date.now(), ini = agora - NWS.dias * DIA, iniAnt = agora - 2 * NWS.dias * DIA;
    const cards = mons.map(r => {
        const termos = NWS.d.monitorados.filter(m => m.rotulo === r).map(m => m.termo);
        const todas = NWS.d.noticias.filter(n => n.cats.includes(r));
        const per = todas.filter(n => n.data >= ini), ant = todas.filter(n => n.data >= iniAnt && n.data < ini);
        const fontes = new Set(per.map(n => n.fonte)).size;
        return `<div class="card rl-mon"><div class="rl-mon-cab"><span class="rl-mon-ic">${ic('user')}</span><div style="flex:1;min-width:0"><h3>${esc(r)}</h3><p>Monitorando: ${termos.map(t => `<b>${esc(t)}</b>`).join(' · ')}</p></div>
            <div class="rl-mon-n"><b>${fmtN(per.length)}</b><small>menções em ${NWS.dias} dias${ant.length ? ` · ${per.length >= ant.length ? '▲' : '▼'} ${Math.abs(Math.round(100 * (per.length - ant.length) / ant.length))}%` : ''}</small></div>
            ${per.length ? `<button class="btn btn-s btn-sm" onclick="NWS.cat='${esc(r)}';NWS.lim=30;rRelease();setTimeout(()=>{const l=document.querySelector('#cont-release .rl-lista');if(l)l.scrollIntoView({behavior:'smooth',block:'start'})},50)">Ver todas</button>` : ''}</div>
            ${per.length ? `<div class="rl-mon-lista">${per.slice(0, 4).map(n => `<a href="${esc(n.link)}" target="_blank" rel="noopener noreferrer"><span class="d">${n.data.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' })}</span><span class="t">${esc(n.titulo)}<small>${esc(n.fonte)}${n.cats.filter(c => c !== r).length ? ' · ' + esc(n.cats.filter(c => c !== r).join(', ')) : ''}</small></span>${ic('link')}</a>`).join('')}</div><div class="rl-mon-rod mut">${fontes} veículo(s) no período</div>` : `<div class="vazio peq">Nenhuma menção nos últimos ${NWS.dias} dias.</div>`}</div>`;
    }).join('');
    k.insertAdjacentHTML('afterend', cards);
};
/* Seção própria no relatório do Release */
const _docReleaseMon = documentoRelease;
documentoRelease = function () {
    const D = _docReleaseMon();
    const mons = NWS.d && NWS.d.monitorados ? [...new Set(NWS.d.monitorados.map(m => m.rotulo))] : [];
    if (!mons.length) return D;
    const ini = Date.now() - NWS.dias * DIA;
    const html = mons.map(r => { const per = NWS.d.noticias.filter(n => n.cats.includes(r) && n.data >= ini); const termos = NWS.d.monitorados.filter(m => m.rotulo === r).map(m => m.termo).join('; ');
        return `<p><b>${esc(r)}</b> (termos: ${esc(termos)}): ${per.length} menção(ões) nos últimos ${NWS.dias} dias, em ${new Set(per.map(n => n.fonte)).size} veículo(s).</p>${per.length ? `<table class="t"><thead><tr><th style="width:62px">Data</th><th>Notícia</th><th>Veículo</th></tr></thead><tbody>${per.slice(0, 60).map(n => `<tr><td>${n.data.toLocaleDateString('pt-BR')}</td><td><a href="${esc(n.link)}">${esc(n.titulo)}</a></td><td>${esc(n.fonte)}</td></tr>`).join('')}</tbody></table>` : ''}`; }).join('');
    // insere como seção 2 (depois da Síntese), refazendo o documento
    const sec = { t: 'Monitoramento institucional', html };
    const m = D.html.match(/<div class="dx-sec"><h2><span>1\.<\/span>Síntese<\/h2>/);
    if (!m) return D;
    return Object.assign(D, { html: renumerar(D.html.replace(/(<div class="dx-sec"><h2><span>2\.<\/span>)/, `<div class="dx-sec"><h2><span>2.</span>${esc(sec.t)}</h2>${sec.html}</div>$1`).replace('<li>Síntese</li>', '<li>Síntese</li><li>' + esc(sec.t) + '</li>')) });
};
function renumerar(h) { let i = 0; return h.replace(/<h2><span>\d+\.<\/span>/g, () => `<h2><span>${++i}.</span>`); }
